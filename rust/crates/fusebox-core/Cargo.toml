[package]
name = "fusebox-core"
version.workspace = true
edition.workspace = true
description = "Execution contracts, policy types and receipt journal for the Fusebox enforcement core"
license.workspace = true

[lib]
name = "fusebox_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "process", "sync", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "process", "sync", "time", "macros", "test-util"] }
