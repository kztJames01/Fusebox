[package]
name = "fusebox-cli"
version.workspace = true
edition.workspace = true
description = "Fusebox Rust binary — run, proxy, receipts, verify and policy commands"
license.workspace = true

[[bin]]
name = "fusebox"
path = "src/main.rs"

[dependencies]
fusebox-core = { path = "../fusebox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-util", "io-std", "process", "sync", "time", "macros", "signal"] }
